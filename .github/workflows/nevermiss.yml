# NeverMiss automatic workflow

name: NeverMiss

# Run manually for testing and automatically every 15 minutes
on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"


jobs:
  run-nevermiss:

    # GitHub gives NeverMiss a temporary cloud computer
    runs-on: ubuntu-latest

    steps:

      # Download the NeverMiss project from GitHub
      - name: Get NeverMiss code
        uses: actions/checkout@v4


      # Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # Install the packages NeverMiss needs
      - name: Install dependencies
        run: pip install -r requirements.txt


      # Create Gmail authentication files from GitHub Secrets
      - name: Set up Gmail authentication
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_TOKEN: ${{ secrets.GOOGLE_TOKEN }}
        run: |
          printf '%s' "$GOOGLE_CREDENTIALS" > credentials.json
          printf '%s' "$GOOGLE_TOKEN" > token.json


      # Restore the list of emails already sent to Telegram
      - name: Restore email tracking
        uses: actions/cache/restore@v4
        with:
          path: sent_ids.json
          key: nevermiss-sent-ids-${{ github.run_id }}
          restore-keys: |
            nevermiss-sent-ids-


      # Run NeverMiss
      - name: Run NeverMiss
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python nevermiss.py


      # Save the updated email tracking for the next run
      - name: Save email tracking
        uses: actions/cache/save@v4
        with:
          path: sent_ids.json
          key: nevermiss-sent-ids-${{ github.run_id }}